name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# softprops/action-gh-release 需要写权限；默认 token 常常是只读的
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check map floors and layer menu regressions
        run: dotnet run --project tests/FloorRegression/FloorRegression.csproj -c Release

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $appVersion = ([xml](Get-Content -LiteralPath TarkovMapLite.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ('${{ github.ref_name }}' -cne "v$appVersion") { throw "Release tag must match v$appVersion" }

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Write executable checksum
        shell: pwsh
        run: |
          $exeDigest = (Get-FileHash -LiteralPath publish/TarkovMapLite.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'publish/TarkovMapLite.exe.sha256'), "$exeDigest  TarkovMapLite.exe`n", [Text.UTF8Encoding]::new($false))

      - name: Build updater test applications
        run: |
          dotnet publish tests/UpdaterFixture/UpdaterFixture.csproj -c Release -p:Version=9.9.8 -o updater-fixture-old
          dotnet publish tests/UpdaterFixture/UpdaterFixture.csproj -c Release --no-restore -p:Version=9.9.9 -o updater-fixture-new

      - name: Verify published updater replacement and rollback
        run: dotnet run --project tests/FloorRegression/FloorRegression.csproj -c Release --no-build -- --update-integration publish/TarkovMapLite.exe updater-fixture-old/TarkovMapLite.exe updater-fixture-new/TarkovMapLite.exe updater-integration

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarkovMapLite-win-x64
          path: |
            publish/TarkovMapLite.exe
            publish/TarkovMapLite.exe.sha256

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/TarkovMapLite.exe
            publish/TarkovMapLite.exe.sha256
          generate_release_notes: true
